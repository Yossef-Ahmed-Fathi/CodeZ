<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- 🔥 PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- 🔥 Meta Tags للـ SEO -->
    <title>CodeZ Reels</title>
    <meta
      name="description"
      content="منصة لمشاهدة فيديوهات تعليمية من يوتيوب بشكل مريح وسهل"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="CodeZ Reels" />
    <meta
      property="og:description"
      content="شاهد فيديوهات تعليمية من يوتيوب بشكل مريح"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://codez-reels.vercel.app/" />

    <title>CodeZ Reels</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- 🔥 تسجيل Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("/sw.js")
          .then(() => console.log("✅ Service Worker registered"))
          .catch((err) => console.log("❌ Service Worker error:", err));
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
