<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- SEO -->
    <title>CodeZ - Educational Reels</title>
    <meta
      name="description"
      content="Educational video platform - Watch educational videos from YouTube in a seamless reel format"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="CodeZ - Educational Reels" />
    <meta
      property="og:description"
      content="Watch educational videos from YouTube in a seamless reel format"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://codez.vercel.app" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Service Worker Registration (for PWA) -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("/sw.js")
          .then(() => console.log("✅ Service Worker registered"))
          .catch((err) => console.log("❌ Service Worker error:", err));
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
